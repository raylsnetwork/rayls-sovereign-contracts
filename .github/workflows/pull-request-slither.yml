name: Slither Analysis

on:
  pull_request:
    branches:
      - main
      - 'version-*'
      - 'version/*'
  workflow_dispatch:

jobs:
  slither:
    name: Slither Static Analysis
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@de808b1eea699e761c404bda44ba8f21aba30b2c  # v1.3.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'

      - name: Install solc
        run: |
          wget -q https://github.com/ethereum/solidity/releases/download/v0.8.24/solc-static-linux -O solc
          chmod +x solc
          sudo mv solc /usr/local/bin/solc
          solc --version

      - name: Install Slither
        run: pip install slither-analyzer==0.10.4

      - name: Run Slither
        run: |
          slither . \
            --config-file slither.config.json \
            --json slither-report.json \
            2>&1 | tee slither-output.txt || true

      - name: Generate findings comment
        id: summary
        if: always()
        run: |
          python3 << 'PYEOF'
          import json, os

          output = os.environ['GITHUB_OUTPUT']
          comment_file = 'slither-comment.md'

          if not os.path.isfile('slither-report.json'):
              with open(output, 'a') as fh:
                  fh.write('has_findings=false\n')
                  fh.write('slither_failed=true\n')
              with open(comment_file, 'w') as f:
                  f.write('## Slither Static Analysis\n\n')
                  f.write('Slither failed to produce a report. Check the workflow logs for details.\n')
              exit(0)

          with open('slither-report.json', 'r') as f:
              data = json.load(f)

          results = data.get('results', {}).get('detectors', [])
          counts = {'High': 0, 'Medium': 0, 'Low': 0, 'Informational': 0}

          for r in results:
              impact = r.get('impact', 'Unknown')
              if impact in counts:
                  counts[impact] += 1

          total = sum(counts.values())

          # Console summary
          print('Slither Findings Summary:')
          for sev, count in counts.items():
              print(f'  {sev}: {count}')
          print(f'  Total: {total}')

          # Step outputs
          with open(output, 'a') as fh:
              fh.write(f'high={counts["High"]}\n')
              fh.write(f'medium={counts["Medium"]}\n')
              fh.write(f'low={counts["Low"]}\n')
              fh.write(f'informational={counts["Informational"]}\n')
              fh.write(f'total={total}\n')
              fh.write(f'has_findings={"true" if total > 0 else "false"}\n')
              fh.write('slither_failed=false\n')

          # Build PR comment
          lines = []
          lines.append('## Slither Static Analysis\n')

          if total == 0:
              lines.append('No findings detected\n')
          else:
              lines.append(f'**{total}** finding(s) detected\n')
              lines.append('| Severity | Count |')
              lines.append('|----------|-------|')
              for sev, count in counts.items():
                  if count > 0:
                      lines.append(f'| {sev} | {count} |')
              lines.append('')

              # Group findings by severity
              by_severity = {}
              for r in results:
                  sev = r.get('impact', 'Unknown')
                  by_severity.setdefault(sev, []).append(r)

              for sev in ['High', 'Medium', 'Low', 'Informational']:
                  findings = by_severity.get(sev, [])
                  if not findings:
                      continue

                  lines.append(f'<details>')
                  lines.append(f'<summary>{sev} ({len(findings)})</summary>\n')

                  for i, r in enumerate(findings, 1):
                      check = r.get('check', 'unknown')
                      desc = r.get('description', 'No description').strip()
                      # Truncate long descriptions
                      if len(desc) > 500:
                          desc = desc[:500] + '...'
                      lines.append(f'**{i}. {check}**\n')
                      lines.append(f'```')
                      lines.append(desc)
                      lines.append(f'```\n')

                  lines.append('</details>\n')

          with open(comment_file, 'w') as f:
              f.write('\n'.join(lines))
          PYEOF

      - name: Post Slither results to PR
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: slither-analysis
          path: slither-comment.md

      - name: Upload Slither Reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: slither-reports
          path: |
            slither-report.json
            slither-output.txt
          retention-days: 14

      - name: Fail on high severity findings
        if: steps.summary.outputs.high != '0' && steps.summary.outputs.high != ''
        run: |
          echo "High severity findings detected"
          exit 1
