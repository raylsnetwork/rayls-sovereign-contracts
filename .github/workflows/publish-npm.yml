name: Publish npm Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read
  id-token: write # Required for npm Trusted Publishers (OIDC)

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-22.04
    environment: npm-publish
    # TODO: Temporarily publishing from root directory instead of src/rayls-protocol-sdk
    # defaults:
    #   run:
    #     working-directory: src/rayls-protocol-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Determine npm tag
        id: npm-tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if echo "$VERSION" | grep -q '-'; then
            echo "tag=nightly" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        run: npm publish --tag ${{ steps.npm-tag.outputs.tag }}
