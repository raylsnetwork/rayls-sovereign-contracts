[profile.default]
src = 'src'
out = 'out'
libs = ['node_modules', 'lib']
test = 'src/test'
cache_path  = 'cache_forge'
solc_version = '0.8.24'
optimizer = true
optimizer_runs = 50
evm_version = 'paris'
extra_output = ["storageLayout"]
# ^ can also add these: ["metadata", "ir", "irOptimized"], but compile time will be at ~125s

[profile.hardhat]
src = "src"
out = "artifacts"
libs = ["node_modules"]